[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dev-lab"
version = "0.1.0"
description = "Svens AI Dev Lab"
requires-python = ">=3.11"
dependencies = [
    "psutil",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netmon*", "agent*", "tools*"]

[tool.setuptools.package-data]
"netmon.core" = ["mozilla-release.gpg"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
